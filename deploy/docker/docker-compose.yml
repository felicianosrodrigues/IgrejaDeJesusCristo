services:
  backend:
    build:
      context: ./backend  # ← SOBE 2 NÍVEIS
      dockerfile: Dockerfile
    container_name: igreja-backend
    restart: unless-stopped
    env_file:
      - ./.env.backend  # ← AJUSTA TAMBÉM
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/church-info"]
      interval: 20s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend  # ← SOBE 2 NÍVEIS
      dockerfile: Dockerfile
    container_name: igreja-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"

  mongo:
    image: mongo:7
    container_name: igreja-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  mongo_data: